---
name: scrumlr-dev
services:
  nats:
    image: nats:2.14.4-alpine
    command: ["-js"]
    ports:
      - "4222:4222"

  redis:
    image: redis:8.10.0
    ports:
      - "6379:6379"

  database:
    image: postgres:18.4
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=supersecret
      - POSTGRES_DB=scrumlr
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C

  lgtm-stack:
    image: grafana/otel-lgtm:0.30.1
    ports:
      - "4317:4317"
      - "4318:4318"
      - "5000:3000"
